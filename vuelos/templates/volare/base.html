{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Volare{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'volare/css/styles.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="site-header">
        <h1><a href="{% url 'vuelos:index' %}">Volare</a></h1>
        <nav class="main-nav">
            <ul>
                <li><a href="{% url 'vuelos:aerolinea_list' %}">Aerolíneas</a></li>
                <li><a href="{% url 'vuelos:pais_list' %}">Países</a></li>
                <li><a href="{% url 'vuelos:aeropuerto_list' %}">Aeropuertos</a></li>
            </ul>
        </nav>
    </header>

    <main class="site-main">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p>Volare &copy; 2025</p>
    </footer>
    
    <!-- script javascript -->
    <script src="{% static 'volare/js/validaciones.js' %}"></script>
</body>
</html>
